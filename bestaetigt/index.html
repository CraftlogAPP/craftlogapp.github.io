    * { box-sizing: border-box; margin: 0; padding: 0; }

    .steps li { counter-increment: s; display: flex; gap: 12px; }

    footer { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 18px; margin-top: 22px; font-size: 13.5px; color: var(--muted); }
    footer a { color: var(--muted); }
    noscript p { margin-top: 12px; }
  </style>
</head>
